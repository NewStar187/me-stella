name: keep-alive

# Supabase 무료 플랜의 미활동 일시정지를 막기 위해 3일에 1회 health API를 호출한다.
on:
  schedule:
    # 매월 1·4·7·…·28·31일 00:00 UTC 실행 (3일 간격 근사, 월말~월초 간격은 고르지 않음)
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://me-stella.vercel.app/api/health)
          echo "HTTP status: $code"
          test "$code" = "200"
