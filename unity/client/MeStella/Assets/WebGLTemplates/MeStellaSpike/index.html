<!DOCTYPE html>
<!-- Gate 0 spike — 판정 후 폐기 가능 -->
<!-- Unity 6 기본(Default) 웹 템플릿 구조 기반. 캔버스 아래에 HTML 오버레이 <input>을 붙여
     한글 IME 입력을 unityInstance.SendMessage로 Unity에 전달한다(D항목).
     TemplateData 의존을 없애려고 스타일은 이 파일에 인라인으로 둔다. -->
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- 모바일 가상 키보드 대응: interactive-widget=resizes-content 로 키보드가 뜰 때 레이아웃이 줄어들게 한다. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Me.Stella Spike | {{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #1b1b1f;
        color: #ececf1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #unity-container {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #unity-canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        background: #231F20;
      }
      #unity-canvas.unity-mobile {
        width: 100%;
        height: 100%;
      }
      #unity-loading-bar {
        display: none;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 220px;
        text-align: center;
      }
      #unity-logo {
        font-size: 13px;
        color: #9a9aa5;
        margin-bottom: 8px;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 10px;
        background: #34343c;
        border-radius: 5px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #5b8def;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        width: 80%;
        text-align: center;
        color: #111;
        font-size: 13px;
        z-index: 10;
      }
      #unity-footer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        font-size: 12px;
        color: #9a9aa5;
        background: #17171b;
      }
      #unity-build-title {
        flex: 1 1 auto;
      }
      #unity-fullscreen-button {
        cursor: pointer;
        padding: 4px 10px;
        border: 1px solid #45454f;
        border-radius: 4px;
        color: #ececf1;
        user-select: none;
      }
      /* --- D항목: HTML 오버레이 입력 --- */
      #spike-input-bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
        background: #101014;
        border-top: 1px solid #2c2c34;
        will-change: transform;
      }
      #spike-input {
        flex: 1 1 auto;
        min-width: 0;
        /* iOS Safari가 포커스 시 확대하지 않도록 16px 이상 유지 */
        font-size: 16px;
        line-height: 1.4;
        padding: 10px 12px;
        border: 1px solid #55555f;
        border-radius: 6px;
        background: #ffffff;
        color: #111114;
      }
      #spike-input-status {
        flex: 0 0 auto;
        font-size: 12px;
        color: #9a9aa5;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo">loading…</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-fullscreen-button">전체화면</div>
      </div>
    </div>
    <div id="spike-input-bar">
      <input id="spike-input" type="text" placeholder="한글 입력 테스트" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <span id="spike-input-status">Unity 준비 전</span>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // 모바일: 캔버스가 입력 바를 제외한 영역을 채운다.
        // viewport 메타는 head에 이미 선언돼 있으므로 여기서 다시 만들지 않는다.
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        // 데스크톱: 빌드 설정 해상도로 두되 CSS max-width/height로 화면 안에 들어오게 한다.
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      // --- D항목: HTML 오버레이 입력 → Unity SendMessage ---
      var unityInstanceRef = null;
      var spikeInput = document.querySelector("#spike-input");
      var spikeInputBar = document.querySelector("#spike-input-bar");
      var spikeStatus = document.querySelector("#spike-input-status");
      var spikeSendCount = 0;

      spikeInput.addEventListener("input", function () {
        // unityInstance 준비 전 입력은 무시한다.
        if (!unityInstanceRef) {
          return;
        }
        try {
          unityInstanceRef.SendMessage('SpikeManager', 'OnOverlayInput', this.value);
          spikeSendCount++;
          spikeStatus.textContent = "전송 " + spikeSendCount;
        } catch (e) {
          spikeStatus.textContent = "전송 실패";
          console.error("[Spike/D] SendMessage 실패", e);
        }
      });

      // iOS Safari 등 가상 키보드가 레이아웃 뷰포트를 줄이지 않는 브라우저에서
      // 입력 바가 키보드에 가리지 않도록 visualViewport 만큼 위로 올린다.
      if (window.visualViewport) {
        var adjustInputBar = function () {
          var vv = window.visualViewport;
          var overlap = Math.max(0, window.innerHeight - (vv.height + vv.offsetTop));
          spikeInputBar.style.transform = "translateY(-" + overlap + "px)";
        };
        window.visualViewport.addEventListener("resize", adjustInputBar);
        window.visualViewport.addEventListener("scroll", adjustInputBar);
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          unityInstanceRef = unityInstance;
          // 브라우저 콘솔에서 직접 SendMessage를 시험할 수 있도록 노출한다(스파이크 한정).
          window.unityInstance = unityInstance;
          spikeStatus.textContent = "준비됨";
          // 이미 입력돼 있던 값이 있으면 초기 1회 동기화한다.
          if (spikeInput.value) {
            unityInstance.SendMessage('SpikeManager', 'OnOverlayInput', spikeInput.value);
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
